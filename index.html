<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prodaja prasića</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f2e8;
      text-align: center;
      padding: 40px;
    }

    .kartica {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      font-size: 36px;
    }

    p {
      font-size: 20px;
    }

    .telefon {
      font-size: 28px;
      font-weight: bold;
      margin: 25px 0;
    }

    .dugme {
      display: inline-block;
      padding: 15px 30px;
      font-size: 22px;
      background: #2f8f46;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="kartica">

    <h1>Prodaja prasića</h1>

    <p>
      Primamo narudžbine za prasiće.
    </p>

    <p>
      Za cenu, dostupnost i dodatne informacije pozovite:
    </p>

    <div class="telefon">
      063 / 666-038
    </div>

    <a class="dugme" href="tel:+38163666038">
      📞 Pozovi odmah
    </a>

  </div>

</body>
</html>
